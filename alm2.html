<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#22303A">
<title>WinHub — алюминий</title>
<style>*{margin:0;padding:0;box-sizing:border-box}</style>
<style>
/* Своя оболочка: графит и терракота, прямоугольные кнопки, один акцент.
   Порядок работы взят из практики замерщика, оформление собственное. */
:root{
  color-scheme:light;
  --bar:#22303A; --bar-ink:#C7D3DA; --bar-2:#2E3F4B;
  --acc:#C86A1E; --acc-2:#E08B41; --acc-soft:#F7E9DB; --acc-ink:#8A4610;
  --canvas:#DCE1E4; --panel:#F2F3F4; --row:#FFFFFF; --row-2:#F8F9FA;
  --ink:#1A2227; --ink-2:#4E5C64; --ink-3:#849299;
  --line:#D2D8DB; --line-2:#E4E8EA;
  --del:#A33B30; --del-soft:#F7E5E2;
  --ok:#2E7D57; --ok-soft:#E3F1EA; --warn:#8A6100; --warn-soft:#FBF1D8;
  --frame:#EFF1F2; --frame-2:#C9D0D4; --glass:#CBDDE6; --sash:#DDE3E6; --panelfill:#C8C2B4;
}
html,body{height:100%}
body{background:var(--canvas); color:var(--ink);
  font:400 15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  overflow-x:hidden}

.head{position:sticky; top:0; z-index:30}
.appbar{background:var(--bar); color:#fff;
  padding:calc(env(safe-area-inset-top) + 11px) 12px 11px; display:flex; align-items:center; gap:12px;
  border-bottom:2px solid var(--acc)}
.appbar h1{flex:1 1 auto; min-width:0; font-size:17px; font-weight:600; letter-spacing:.2px;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.appbar .who{font-size:11.5px; color:var(--bar-ink); white-space:nowrap; overflow:hidden;
  text-overflow:ellipsis; max-width:44vw; text-align:right}

.canvas{padding:8px 0 2px}
svg.win{display:block; width:100%; height:auto; max-height:46vh; touch-action:manipulation}
svg.win .hit{cursor:pointer}

.dims{position:sticky; z-index:24; bottom:calc(116px + env(safe-area-inset-bottom));
  background:var(--panel); border-top:1px solid var(--line); padding:7px 9px;
  display:flex; gap:7px; align-items:center; flex-wrap:wrap;
  box-shadow:0 -3px 10px -6px rgba(0,0,0,.3)}
.dims .g{display:flex; gap:5px; align-items:center}
.dims label{font-size:10.5px; color:var(--ink-3); text-transform:uppercase; letter-spacing:.06em}
.dims input{width:66px; background:var(--row); border:1px solid var(--line); border-radius:4px;
  padding:6px 7px; font:600 14px system-ui,sans-serif; color:var(--ink); text-align:center}
.dims input:focus{outline:2px solid var(--acc); outline-offset:0}
.dims .cap{flex:1 1 100%; font-size:12px; color:var(--ink-2); padding-top:1px}
.dims .cap b{color:var(--acc-ink)}

.sum{background:var(--panel); border-bottom:1px solid var(--line); overflow-x:auto;
  box-shadow:0 3px 10px -6px rgba(0,0,0,.35)}
.sum[hidden]{display:none}
.sum table{border-collapse:collapse; min-width:100%; font-size:12px; white-space:nowrap}
.sum th,.sum td{padding:4px 9px; text-align:right; border-bottom:1px solid var(--line-2)}
.sum th:first-child,.sum td:first-child{text-align:left; position:sticky; left:0; background:var(--panel)}
.sum thead th{color:var(--ink-3); font-weight:600; font-size:10.5px; text-transform:uppercase;
  letter-spacing:.05em; background:var(--line-2)}
.sum tr.all td{background:var(--row-2); font-weight:700}
.sum td.acc{color:var(--acc-ink); font-weight:700}

.dock{position:sticky; z-index:25; bottom:calc(56px + env(safe-area-inset-bottom));
  background:var(--bar-2); display:flex; align-items:stretch; min-height:60px;
  border-top:1px solid rgba(255,255,255,.08)}
.dock .plus{width:62px; flex:0 0 auto; background:var(--acc); border:0; color:#fff;
  font:300 32px/1 system-ui,sans-serif; cursor:pointer}
.dock .strip{flex:1 1 auto; display:flex; gap:6px; overflow-x:auto; padding:7px 8px; align-items:center}
.dock .thumb{flex:0 0 auto; width:46px; height:46px; border-radius:4px; background:var(--bar-2);
  border:2px solid transparent; cursor:pointer; padding:3px; position:relative}
.dock .thumb[aria-pressed="true"]{border-color:var(--acc-2)}
.dock .thumb svg{width:100%; height:100%; display:block}
.dock .thumb b{position:absolute; right:2px; bottom:0; font-size:9px; color:#fff}
.dock .empty{color:var(--bar-ink); font-size:12.5px; padding:0 8px; align-self:center}

.list{padding:10px}
.ord{display:flex; align-items:center; gap:10px; width:100%; background:var(--row);
  border:1px solid var(--line); border-left:3px solid var(--acc); border-radius:4px;
  padding:12px 13px; margin-bottom:8px; cursor:pointer; font:inherit; color:inherit; text-align:left}
.ord .no{color:var(--acc-ink); font-weight:700; font-size:13px; flex:0 0 auto}
.ord .mid{flex:1 1 auto; min-width:0}
.ord .nm{font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.ord .meta{font-size:12px; color:var(--ink-3); margin-top:2px}
.ord .cnt{font-size:12px; color:var(--ink-2); flex:0 0 auto}
.empty-note{background:var(--row); border:1px solid var(--line); border-radius:4px;
  padding:14px; color:var(--ink-2); font-size:14px}

.scrim{position:fixed; inset:0; z-index:40; background:rgba(20,28,34,.5); display:none}
.scrim.on{display:block}
.modal{position:fixed; z-index:50; left:50%; top:50%; transform:translate(-50%,-50%);
  width:min(94vw,560px); max-height:88vh; background:var(--panel); display:none; flex-direction:column;
  border-radius:6px; overflow:hidden; box-shadow:0 12px 40px rgba(0,0,0,.35)}
.modal.on{display:flex}
.modal .mh{background:var(--bar); color:#fff; padding:13px 16px; font-size:16px; font-weight:600;
  border-bottom:2px solid var(--acc)}
.modal .mb{flex:1 1 auto; overflow-y:auto; padding:12px}
.modal .mf{display:flex; gap:9px; justify-content:flex-end; padding:11px 12px;
  background:var(--row); border-top:1px solid var(--line)}
.btn{border-radius:4px; padding:11px 18px; font:600 14px system-ui,sans-serif; cursor:pointer; border:1px solid}
.btn.pri{background:var(--acc); border-color:var(--acc); color:#fff}
.btn.alt{background:var(--row); border-color:var(--line); color:var(--ink-2)}
.btn.dan{background:var(--row); border-color:var(--del); color:var(--del)}

.ssec{font:700 10.5px/1 system-ui,sans-serif; letter-spacing:.11em; text-transform:uppercase;
  color:var(--ink-3); border-left:3px solid var(--acc); padding-left:8px; margin:14px 0 8px}
.ssec:first-child{margin-top:0}
.two{display:grid; gap:14px; grid-template-columns:1fr}
@media(min-width:520px){ .two{grid-template-columns:1fr 1fr} }
.picks{display:grid; grid-template-columns:repeat(3,1fr); gap:8px}
.pick{background:var(--row); border:1px solid var(--line); border-radius:4px; padding:6px; cursor:pointer; font:inherit}
.pick[aria-pressed="true"]{border-color:var(--acc); box-shadow:inset 0 0 0 1px var(--acc); background:var(--acc-soft)}
.pick svg{display:block; width:100%; height:auto}
.pick span{display:block; font-size:9.5px; color:var(--ink-3); margin-top:4px; text-align:center; line-height:1.25}
.tpls{display:grid; grid-template-columns:repeat(3,1fr); gap:8px}
@media(min-width:520px){ .tpls{grid-template-columns:repeat(4,1fr)} }

.panel{position:fixed; z-index:50; top:0; right:0; bottom:0; width:min(94vw,420px);
  background:var(--panel); display:none; flex-direction:column; box-shadow:-8px 0 30px rgba(0,0,0,.3)}
.panel.on{display:flex}
.panel .ph{background:var(--bar); color:#fff; padding:calc(env(safe-area-inset-top) + 13px) 16px 13px;
  font-size:16px; font-weight:600; border-bottom:2px solid var(--acc)}
.panel .pb{flex:1 1 auto; overflow-y:auto; -webkit-overflow-scrolling:touch}
.panel .pf{flex:0 0 auto; display:flex; gap:9px; justify-content:flex-end;
  padding:11px 12px calc(11px + env(safe-area-inset-bottom)); background:var(--row); border-top:1px solid var(--line)}
.sec{background:var(--line-2); color:var(--ink-2); font:700 10.5px/1 system-ui,sans-serif;
  letter-spacing:.11em; text-transform:uppercase; padding:9px 14px; border-left:3px solid var(--acc)}
.opt{display:flex; align-items:center; gap:12px; width:100%; background:var(--row); border:0;
  border-bottom:1px solid var(--line-2); padding:12px 14px; font:400 15px system-ui,sans-serif;
  color:var(--ink); cursor:pointer; text-align:left}
.opt .mark{width:18px; height:18px; border:2px solid var(--ink-3); border-radius:3px; flex:0 0 auto; position:relative}
.opt[aria-pressed="true"]{background:var(--acc-soft)}
.opt[aria-pressed="true"] .mark{border-color:var(--acc)}
.opt[aria-pressed="true"] .mark::after{content:""; position:absolute; inset:3px; background:var(--acc)}
.opt .sub{display:block; font-size:11.5px; color:var(--ink-3); margin-top:2px}
.fld{background:var(--row); border-bottom:1px solid var(--line-2); padding:10px 14px;
  display:flex; align-items:center; gap:10px; flex-wrap:wrap}
.fld label{flex:1 1 140px; font-size:14px; color:var(--ink-2)}
.fld label small{display:block; font-size:11px; color:var(--ink-3)}
.fld input,.fld textarea{flex:0 0 110px; background:var(--row-2); border:1px solid var(--line);
  border-radius:4px; padding:8px 9px; font:600 15px system-ui,sans-serif; color:var(--ink); text-align:right}
.fld input.wide,.fld textarea{flex:1 1 100%; text-align:left}
.fld textarea{min-height:64px; resize:vertical; font-weight:400}
.stepper{display:flex; background:var(--row); border-bottom:1px solid var(--line-2)}
.stepper button{width:66px; background:var(--line-2); border:0; font:400 24px/1 system-ui,sans-serif;
  padding:12px 0; cursor:pointer; color:var(--ink-2)}
.stepper span{flex:1 1 auto; text-align:center; font:700 19px/48px system-ui,sans-serif}
.ptbl{background:var(--row); overflow-x:auto}
.ptbl table{border-collapse:collapse; width:100%; font-size:12.5px}
.ptbl th,.ptbl td{padding:5px 7px; border-bottom:1px solid var(--line-2); text-align:left; white-space:nowrap}
.ptbl th{font-size:10px; text-transform:uppercase; color:var(--ink-3); letter-spacing:.06em}
.ptbl input{width:70px; background:var(--row-2); border:1px solid var(--line); border-radius:4px;
  padding:6px 7px; font:600 13px system-ui,sans-serif; text-align:right}
.ptbl input.w{width:116px; text-align:left; font-weight:400}
.ptbl .del{background:none; border:0; color:var(--del); font:700 16px/1 system-ui,sans-serif; cursor:pointer; padding:4px 8px}
.padd{background:var(--row); border-bottom:1px solid var(--line-2); padding:9px 14px; display:flex; gap:8px; flex-wrap:wrap}
.pnote{background:var(--warn-soft); border-bottom:1px solid var(--line-2); padding:10px 14px;
  font-size:12.5px; color:var(--warn)}

/* нижнее меню: четыре раздела и «Ещё» со шторкой */
.nav{position:fixed; left:0; right:0; bottom:0; z-index:35; display:flex; background:var(--bar);
  border-top:2px solid var(--acc); padding-bottom:env(safe-area-inset-bottom)}
.nav button{flex:1 1 0; min-width:0; background:none; border:0; cursor:pointer; color:var(--bar-ink);
  display:flex; flex-direction:column; align-items:center; gap:3px; padding:8px 2px 7px;
  font:600 9.5px/1 system-ui,sans-serif; border-top:2px solid transparent; margin-top:-2px}
.nav button[aria-current="true"]{color:#fff; border-top-color:var(--acc-2)}
.nav svg{width:19px; height:19px; stroke:currentColor; fill:none; stroke-width:1.7;
  stroke-linecap:round; stroke-linejoin:round}
.nav span{max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}

.sheet{position:fixed; left:0; right:0; z-index:45; bottom:calc(56px + env(safe-area-inset-bottom));
  background:var(--row); border-top:2px solid var(--acc); box-shadow:0 -8px 30px rgba(0,0,0,.28);
  display:none}
.sheet.on{display:block}
.sheet .cap{font:700 10px/1 system-ui,sans-serif; color:var(--ink-3); text-transform:uppercase;
  letter-spacing:.11em; padding:13px 16px 7px}
.sheet button.mi{display:flex; align-items:center; width:100%; background:none; border:0;
  border-top:1px solid var(--line-2); padding:14px 16px; font:400 15px system-ui,sans-serif;
  color:var(--ink); cursor:pointer; text-align:left; border-left:3px solid transparent}
.sheet button.mi[aria-current="true"]{background:var(--acc-soft); color:var(--acc-ink);
  font-weight:600; border-left-color:var(--acc)}

.res{padding:10px}
.rcard{background:var(--row); border:1px solid var(--line); border-radius:4px; margin-bottom:10px; overflow:hidden}
.rcard .rh{background:var(--line-2); padding:9px 12px; font-size:12px; font-weight:700; color:var(--ink-2);
  text-transform:uppercase; letter-spacing:.06em; display:flex; justify-content:space-between; gap:8px; flex-wrap:wrap}
.rcard .rh span:last-child{text-transform:none; letter-spacing:0; font-weight:400; color:var(--ink-3)}
.rcard .rb{padding:10px 12px}
.gu{display:flex; align-items:center; gap:12px; border-bottom:1px solid var(--line-2); padding:11px 0; flex-wrap:wrap}
.gu:last-child{border-bottom:0}
.gu .sz{font:700 clamp(20px,5.6vw,27px)/1.05 ui-monospace,"SF Mono",Menlo,Consolas,monospace; letter-spacing:-.5px}
.gu .mid{flex:1 1 170px; min-width:0}
.gu .sub{font-size:12px; color:var(--ink-3); margin-top:4px}
.gu .q{font:700 19px system-ui,sans-serif; white-space:nowrap; color:var(--acc-ink)}
.gu.bad .sz{color:var(--del)}
.tot{display:flex; gap:14px; flex-wrap:wrap; padding:10px 12px; background:var(--row-2);
  border-top:1px solid var(--line-2); font-size:13px; color:var(--ink-2)}
.tot b{color:var(--ink)}
.chk{border:1px solid; border-radius:4px; padding:9px 11px; font-size:13px; margin:0 0 8px}
.chk.crit{background:var(--del-soft); border-color:#D9AEA8; color:#7E2A20}
.chk.warn{background:var(--warn-soft); border-color:#DCC58A; color:var(--warn)}
.chk.ok{background:var(--ok-soft); border-color:#A8CDBA; color:var(--ok)}
.cutbar{display:flex; height:26px; border:1px solid var(--line); border-radius:3px; overflow:hidden;
  background:repeating-linear-gradient(45deg,var(--line-2),var(--line-2) 5px,transparent 5px,transparent 10px)}
.cutbar div{border-right:1px solid var(--row); background:var(--bar); color:#fff;
  font:600 10px/26px ui-monospace,monospace; text-align:center; overflow:hidden; white-space:nowrap}
.cutbar div.rest{background:transparent; color:var(--ink-3); border-right:0}
.cuth{display:flex; justify-content:space-between; font-size:11.5px; color:var(--ink-3); margin:9px 0 4px}
.dtbl{overflow-x:auto}
.dtbl table{border-collapse:collapse; width:100%; font-size:12.5px; white-space:nowrap}
.dtbl th,.dtbl td{padding:6px 8px; border-bottom:1px solid var(--line-2); text-align:left}
.dtbl th{font-size:10px; text-transform:uppercase; color:var(--ink-3); letter-spacing:.06em}
.dtbl td.r,.dtbl th.r{text-align:right}
.dtbl td.num{font-family:ui-monospace,Menlo,Consolas,monospace}
.dtbl tr.grp td{background:var(--row-2); font-weight:700; color:var(--ink-2)}
.derive{font:500 12px/1.7 ui-monospace,Menlo,Consolas,monospace; background:var(--row-2);
  border:1px solid var(--line-2); border-radius:4px; padding:11px; overflow-x:auto; white-space:pre}
.derive b{color:var(--acc-ink); font-weight:700}
.derive .bad{color:var(--del)} .derive .good{color:var(--ok)}

.toast{position:fixed; left:50%; transform:translateX(-50%); bottom:84px; z-index:60; background:var(--bar);
  color:#fff; padding:11px 16px; border-radius:4px; font-size:13.5px; opacity:0; pointer-events:none;
  transition:opacity .18s; max-width:90vw; text-align:center}
.toast.on{opacity:1}
section[hidden]{display:none}
body{padding-bottom:calc(56px + env(safe-area-inset-bottom))}
</style>
</head>
<body>

<header class="head">
  <div class="appbar">
    <h1 id="ttl">WinHub Алюминий</h1>
    <div class="who" id="who">—</div>
  </div>
  <div class="sum" id="sumTbl" hidden></div>
</header>

<section id="s-orders">
  <div class="list" id="ordList"></div>
</section>

<section id="s-canvas" hidden>
  <div class="canvas"><svg class="win" id="draw" viewBox="0 0 360 392" role="img" aria-label="Изделие"></svg></div>
  <div class="dims" id="dims"></div>
</section>

<section id="s-glass" hidden>
  <div class="res">
    <div class="rcard">
      <div class="rh"><span>Стеклопакеты заказа</span><span id="glassHint">—</span></div>
      <div class="rb" id="glassList"></div>
      <div class="tot" id="glassTot"></div>
    </div>
    <div class="rcard" id="panelCard" hidden>
      <div class="rh"><span>Глухие панели</span><span>сэндвич, не стекло</span></div>
      <div class="rb" id="panelList"></div>
    </div>
    <div class="rcard">
      <div class="rh"><span>По окнам и полям</span></div>
      <div class="rb dtbl"><table id="glassByItem"></table></div>
    </div>
    <div id="glassChecks"></div>
  </div>
</section>

<section id="s-cut" hidden>
  <div class="res">
    <div class="rcard">
      <div class="rh"><span>Раскрой профиля</span><span id="cutHint">—</span></div>
      <div class="rb">
        <div class="fld" style="border:0;padding:0 0 10px">
          <label>Хлыст, мм</label><input type="number" id="cutStock" step="100">
          <label>Пропил, мм</label><input type="number" id="cutKerf" step="1">
        </div>
        <div id="cutMaps"></div>
      </div>
    </div>
    <div class="rcard">
      <div class="rh"><span>Ведомость деталей</span></div>
      <div class="rb dtbl"><table id="partTbl"></table></div>
    </div>
  </div>
</section>

<section id="s-edge" hidden>
  <div class="res">
    <div class="rcard">
      <div class="rh"><span id="edgeTitle">Поле</span><span>вывод результата</span></div>
      <div class="rb"><div class="derive" id="edgeDerive"></div></div>
    </div>
    <div id="edgeWarn"></div>
    <div class="rcard">
      <div class="rh"><span>Комплектующие поля</span></div>
      <div class="rb dtbl"><table id="kitTbl"></table></div>
    </div>
  </div>
</section>

<section id="s-client" hidden>
  <div class="res">
    <div class="rcard">
      <div class="rh"><span>Заказчик</span><span>можно пропустить</span></div>
      <div class="rb" style="padding:0">
        <div class="fld"><label>Имя</label><input type="text" id="cName" class="wide"></div>
        <div class="fld"><label>Телефон</label><input type="tel" id="cPhone" class="wide"></div>
        <div class="fld"><label>Адрес объекта</label><input type="text" id="cAddr" class="wide"></div>
        <div class="fld"><label>Заметка</label><textarea id="cNote"></textarea></div>
      </div>
    </div>
    <div style="display:flex;gap:9px;justify-content:flex-end"><button class="btn pri" id="cDone">Дальше</button></div>
  </div>
</section>

<div class="dock" id="dock">
  <button class="plus" id="plus" aria-label="Добавить">+</button>
  <div class="strip" id="strip"></div>
</div>

<div class="scrim" id="scrim"></div>

<div class="modal" id="mTpl">
  <div class="mh">Конфигурация окна</div>
  <div class="mb"><div class="tpls" id="tplGrid"></div></div>
  <div class="mf"><button class="btn alt" id="tplNo">Отмена</button><button class="btn pri" id="tplYes">Поставить</button></div>
</div>

<div class="modal" id="mCell">
  <div class="mh" id="mCellH">Поле</div>
  <div class="mb">
    <div class="two">
      <div><div class="ssec">Деление поля</div><div class="picks" id="cellSplit"></div></div>
      <div><div class="ssec">Открывание</div><div class="picks" id="cellOpen"></div></div>
    </div>
    <div class="ssec">Заполнение</div>
    <div id="cellFill"></div>
    <div class="ssec">Дополнительно</div>
    <div id="cellExtra"></div>
  </div>
  <div class="mf"><button class="btn alt" id="cellNo">Отмена</button><button class="btn pri" id="cellYes">Применить</button></div>
</div>

<div class="panel" id="pWin">
  <div class="ph">Параметры окна</div>
  <div class="pb" id="pWinBody"></div>
  <div class="pf"><button class="btn pri" data-close="pWin">Готово</button></div>
</div>

<div class="panel" id="pSys">
  <div class="ph">Настройки алюминия</div>
  <div class="pb" id="pSysBody"></div>
  <div class="pf"><button class="btn pri" data-close="pSys">Готово</button></div>
</div>

<div class="sheet" id="sheet">
  <div class="cap">Ещё</div>
  <button class="mi" data-nav="s-client">Заказчик</button>
  <button class="mi" data-nav="s-edge">Кромки поля</button>
  <button class="mi" data-open="pWin">Параметры окна</button>

<script>
"use strict";
var $ = function(s,r){ return (r||document).querySelector(s); };
var $$ = function(s,r){ return Array.prototype.slice.call((r||document).querySelectorAll(s)); };
var esc = function(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); };
var plural = function(n,one,few,many){
  var a=Math.abs(n)%100, b=a%10;
  if(a>10&&a<20) return many;
  if(b>1&&b<5) return few;
  return b===1?one:many;
};
var uid = function(p){ return p + Math.random().toString(36).slice(2,8); };

/* ============================================================
   СПРАВОЧНИК АЛЮМИНИЯ. Числа — заглушки до каталожного листа.
   ============================================================ */
function mkSys(o){
  return { id:o.id, n:o.n, depth:o.depth, delta:1,
    L:{f:o.fL, r:o.rL, ovl:o.ovl}, T:{F:o.F, r:o.rL}, Z:{f:o.fZ, r:o.rZ},
    lim:{fillMin:o.fmin, fillMax:o.fmax, clampMin:o.clamp, gapMin:3,
         maxKg:o.kg, sashKg:o.skg, sashW:o.sw, sashH:o.sh},
    beadF:o.beadF, beadZ:o.beadZ };
}
var SYSTEMS = [
  mkSys({id:"w72", n:"Тёплая 72 — терморазрыв 34", depth:72, fL:34, fZ:38, F:72, ovl:10, rL:20, rZ:22,
    fmin:24, fmax:48, clamp:14, kg:110, skg:100, sw:1100, sh:2400,
    beadF:[{a:24,b:24,art:"ШТ-24-Р",g:15},{a:32,b:32,art:"ШТ-32-Р",g:16},{a:40,b:40,art:"ШТ-40-Р",g:16},{a:44,b:48,art:"ШТ-48-Р",g:17}],
    beadZ:[{a:24,b:24,art:"ШТ-24-С",g:16},{a:32,b:32,art:"ШТ-32-С",g:16},{a:40,b:40,art:"ШТ-40-С",g:17},{a:44,b:48,art:"ШТ-48-С",g:18}]}),
  mkSys({id:"w62", n:"Тёплая 62 — терморазрыв 24", depth:62, fL:31, fZ:35, F:62, ovl:9, rL:19, rZ:20,
    fmin:24, fmax:40, clamp:14, kg:90, skg:80, sw:1000, sh:2300,
    beadF:[{a:24,b:24,art:"ШТ-24-Р62",g:15},{a:32,b:32,art:"ШТ-32-Р62",g:15},{a:36,b:40,art:"ШТ-40-Р62",g:16}],
    beadZ:[{a:24,b:24,art:"ШТ-24-С62",g:15},{a:32,b:32,art:"ШТ-32-С62",g:16},{a:36,b:40,art:"ШТ-40-С62",g:16}]}),
  mkSys({id:"c48", n:"Холодная 48 — без терморазрыва", depth:48, fL:26, fZ:30, F:48, ovl:8, rL:15, rZ:16,
    fmin:4, fmax:24, clamp:9, kg:70, skg:60, sw:900, sh:2100,
    beadF:[{a:4,b:6,art:"ШТ-6-Р48",g:10},{a:20,b:24,art:"ШТ-24-Р48",g:12}],
    beadZ:[{a:4,b:6,art:"ШТ-6-С48",g:10},{a:20,b:24,art:"ШТ-24-С48",g:13}]})
];
function sysById(id){
  for(var i=0;i<SYSTEMS.length;i++){ if(SYSTEMS[i].id===id) return SYSTEMS[i]; }
  return SYSTEMS[0];
}
var FILLS = [
  {id:"f04",  n:"стекло 4",        t:4,  gl:4},
  {id:"f24a", n:"24 · 4-16-4",     t:24, gl:8},
  {id:"f32a", n:"32 · 4-24-4",     t:32, gl:8},
  {id:"f32b", n:"32 · 4-10-4-10-4",t:32, gl:12},
  {id:"f40a", n:"40 · 6-16-4-10-4",t:40, gl:14},
  {id:"f44a", n:"44 · 4-16-4-16-4",t:44, gl:12},
  {id:"f48a", n:"48 · 6-16-6-14-6",t:48, gl:18}
];
function fillById(id){
  for(var i=0;i<FILLS.length;i++){ if(FILLS[i].id===id) return FILLS[i]; }
  return null;
}
/* Открывание: расчёт различает глухое и створку; сторона петель на размер
   не влияет, но идёт в чертёж и в комплект фурнитуры. */
var OPEN = [
  {id:"fix",  n:"глухое",                 sash:false},
  {id:"turnL",n:"поворотная, петли слева", sash:true},
  {id:"turnR",n:"поворотная, петли справа",sash:true},
  {id:"tilt", n:"откидная",               sash:true},
  {id:"ttL",  n:"поворотно-откидная лев.", sash:true},
  {id:"ttR",  n:"поворотно-откидная прав.",sash:true},
  {id:"top",  n:"подвесная",              sash:true}
];
function openById(id){
  for(var i=0;i<OPEN.length;i++){ if(OPEN[i].id===id) return OPEN[i]; }
  return OPEN[0];
}
function isSash(t){ return openById(t).sash; }
var SPLITS = [
  {id:"1x1", c:1, r:1, n:"без деления"},
  {id:"2x1", c:2, r:1, n:"2 по ширине"},
  {id:"3x1", c:3, r:1, n:"3 по ширине"},
  {id:"1x2", c:1, r:2, n:"2 по высоте"},
  {id:"1x3", c:1, r:3, n:"3 по высоте"},
  {id:"2x2", c:2, r:2, n:"сетка 2 × 2"}
];
var TPLS = [
  {id:"t1",n:"1 поле",g:[1]},          {id:"t2",n:"2 поля",g:[2]},          {id:"t3",n:"3 поля",g:[3]},
  {id:"t4",n:"4 поля",g:[4]},          {id:"t11",n:"2 ряда",g:[1,1]},       {id:"t111",n:"3 ряда",g:[1,1,1]},
  {id:"tf2",n:"фрамуга и 2",g:[1,2]},  {id:"tf3",n:"фрамуга и 3",g:[1,3]},  {id:"tf4",n:"фрамуга и 4",g:[1,4]},
  {id:"t22",n:"2 ряда по 2",g:[2,2]},  {id:"t33",n:"2 ряда по 3",g:[3,3]},  {id:"t2n",n:"2 поля и низ",g:[2,1]},
  {id:"t3n",n:"3 поля и низ",g:[3,1]}, {id:"t234",n:"фрамуга, 2 и 3",g:[1,2,3]}
];

/* ============================================================
   МОДЕЛЬ ИЗДЕЛИЯ — дерево полей: любое поле делится дальше.
   ============================================================ */
function leaf(fill){ return { sp:null, size:1, type:"fix", fill:fill || UI.defFill, panel:false, mesh:false }; }
function split(dir, kids){ return { sp:dir, size:1, kids:kids }; }
function treeFromTpl(g){
  var rows = g.map(function(n){
    if(n === 1) return leaf();
    var k = []; for(var i=0;i<n;i++) k.push(leaf());
    return split("col", k);
  });
  if(rows.length === 1) return rows[0];
  if(rows.length > 1 && g[0] < g[1]) rows[0].size = 0.32;   /* фрамуга уже нижних */
  return split("row", rows);
}
function mkItem(tplId){
  var t = null, i;
  for(i=0;i<TPLS.length;i++){ if(TPLS[i].id===tplId) t = TPLS[i]; }
  if(!t) t = TPLS[0];
  return { id:uid("i"), tpl:t.id, sysId:UI.defSys, qty:1, W:1500, H:1500, root:treeFromTpl(t.g) };
}
function layout(node, x, y, w, h, out){
  node.x=x; node.y=y; node.w=w; node.h=h;
  if(!node.sp){ out.leaves.push(node); return; }
  var horiz = (node.sp === "col");
  var total = node.kids.reduce(function(a,k){ return a + (k.size||1); }, 0);
  var full = horiz ? w : h, acc = 0, i;
  for(i=0;i<node.kids.length;i++){
    var k = node.kids[i];
    var s = (i === node.kids.length-1) ? (full - acc) : Math.round(full * (k.size||1) / total);
    if(horiz) layout(k, x+acc, y, s, h, out); else layout(k, x, y+acc, w, s, out);
    if(i < node.kids.length-1)
      out.imposts.push({ node:node, i:i, dir:horiz?"v":"h",
        x: horiz ? x+acc+s : x, y: horiz ? y : y+acc+s, len: horiz ? h : w });
    acc += s;
  }
}
function walk(node, cb){
  cb(node);
  if(node.kids) node.kids.forEach(function(k){ walk(k, cb); });
}
function leafByKey(root, key){
  var found = null, n = 0;
  walk(root, function(x){ if(!x.sp){ if(String(n) === String(key)) found = x; n++; } });
  return found;
}
function pathTo(root, target){
  var path = null;
  (function rec(n, acc){
    if(path) return;
    if(n === target){ path = acc.concat([n]); return; }
    if(n.kids) n.kids.forEach(function(k){ rec(k, acc.concat([n])); });
  })(root, []);
  return path || [root];
}
function chain(it, node, dir){
  var path = pathTo(it.root, node), i;
  for(i = path.length - 1; i >= 0; i--) if(path[i].sp === dir) return path[i].kids;
  return null;
}
function parentOf(root, node){
  var p = null;
  walk(root, function(x){ if(x.kids && x.kids.indexOf(node) >= 0) p = x; });
  return p;
}

/* ============================================================
   РАСЧЁТ. Вычет принадлежит кромке заполнения, а не окну.
   ============================================================ */
function pickBead(list, t){
  for(var i=0;i<list.length;i++){ if(t >= list[i].a && t <= list[i].b) return list[i]; }
  return null;
}
function edgeDeduction(sy, nb, kind, t){
  var fnb = (nb === "T") ? sy.T.F/2 : sy.L.f, d = sy.delta;
  if(kind === "fix"){
    var bf = pickBead(sy.beadF, t); if(!bf) return null;
    return { d: fnb - bf.g + d, g: bf.g, bead: bf, r:(nb==="T"?sy.T.r:sy.L.r),
             expr: fnb+" − "+bf.g+" + "+d, words:(nb==="T"?"импост T":"рама L") };
  }
  var bz = pickBead(sy.beadZ, t); if(!bz) return null;
  return { d:(fnb - sy.L.ovl) + sy.Z.f - bz.g + d, g:bz.g, bead:bz, r:sy.Z.r,
           expr:"("+fnb+" − "+sy.L.ovl+") + "+sy.Z.f+" − "+bz.g+" + "+d,
           words:"створка Z у "+(nb==="T"?"импоста T":"рамы L") };
}
function itemCalc(it){
  var sy = sysById(it.sysId), out = {leaves:[], imposts:[]};
  layout(it.root, 0, 0, it.W, it.H, out);
  var cells = [], parts = [], n = 0;
  parts.push({role:"L", art:"Рама L · "+sy.n, L:it.W},{role:"L", art:"Рама L · "+sy.n, L:it.W},
             {role:"L", art:"Рама L · "+sy.n, L:it.H},{role:"L", art:"Рама L · "+sy.n, L:it.H});
  out.imposts.forEach(function(m){
    var len;
    if(m.dir === "v"){
      var top = (m.y === 0) ? sy.L.f : sy.T.F/2, bot = (m.y + m.len >= it.H) ? sy.L.f : sy.T.F/2;
      len = m.len - top - bot;
    }else{
      var lf = (m.x === 0) ? sy.L.f : sy.T.F/2, rt = (m.x + m.len >= it.W) ? sy.L.f : sy.T.F/2;
      len = m.len - lf - rt;
    }
    m.cut = len;
    parts.push({role:"T", art:"Импост T · "+sy.n, L:len});
  });
  out.leaves.forEach(function(nd){
    var fill = fillById(nd.fill) || FILLS[0], t = fill.t;
    var kindL = (nd.x === 0) ? "L" : "T", kindR = (nd.x + nd.w >= it.W) ? "L" : "T";
    var kindT = (nd.y === 0) ? "L" : "T", kindB = (nd.y + nd.h >= it.H) ? "L" : "T";
    var k = isSash(nd.type) ? "sash" : "fix";
    var eL = edgeDeduction(sy,kindL,k,t), eR = edgeDeduction(sy,kindR,k,t),
        eT = edgeDeduction(sy,kindT,k,t), eB = edgeDeduction(sy,kindB,k,t);
    var ok = !!(eL&&eR&&eT&&eB);
    var gw = ok ? nd.w - eL.d - eR.d : 0, gh = ok ? nd.h - eT.d - eB.d : 0;
    var area = gw*gh/1e6;
    var faceL = kindL==="L"?sy.L.f:sy.T.F/2, faceR = kindR==="L"?sy.L.f:sy.T.F/2;
    var faceT = kindT==="L"?sy.L.f:sy.T.F/2, faceB = kindB==="L"?sy.L.f:sy.T.F/2;
    var sashW = (k==="sash") ? nd.w - (faceL - sy.L.ovl) - (faceR - sy.L.ovl) : 0;
    var sashH = (k==="sash") ? nd.h - (faceT - sy.L.ovl) - (faceB - sy.L.ovl) : 0;
    var c = { key:String(n++), nd:nd, sy:sy, type:nd.type, panel:!!nd.panel, mesh:!!nd.mesh,
      fill:fill, t:t, ok:ok, x:nd.x, y:nd.y, w:nd.w, h:nd.h,
      kindL:kindL, kindR:kindR, kindT:kindT, kindB:kindB,
      faceL:faceL, faceR:faceR, faceT:faceT, faceB:faceB,
      eL:eL, eR:eR, eT:eT, eB:eB, gw:gw, gh:gh, area:area,
      kg: area * fill.gl * 2.5, bead: ok ? eL.bead : null, sashW:sashW, sashH:sashH };
    cells.push(c);
    if(ok){
      if(k === "sash")
        parts.push({role:"Z", art:"Створка Z · "+sy.n, L:sashW},{role:"Z", art:"Створка Z · "+sy.n, L:sashW},
                   {role:"Z", art:"Створка Z · "+sy.n, L:sashH},{role:"Z", art:"Створка Z · "+sy.n, L:sashH});
      parts.push({role:"bead", art:"Штапик "+c.bead.art, L:Math.round(gw)},{role:"bead", art:"Штапик "+c.bead.art, L:Math.round(gw)},
                 {role:"bead", art:"Штапик "+c.bead.art, L:Math.round(gh)},{role:"bead", art:"Штапик "+c.bead.art, L:Math.round(gh)});
      parts.push({role:"seal", art:"Уплотнитель", L:Math.round(4*(gw+gh))});
    }
  });
  return { it:it, sy:sy, cells:cells, imposts:out.imposts, parts:parts };
}
function checksOf(R){
  var out = [], sy = R.sy, L = sy.lim;
  if(sy.T.F/2 <= sy.L.ovl)
    out.push({l:"crit", t:"Полуполка импоста "+(sy.T.F/2)+" не больше наплава "+sy.L.ovl+": две створки по бокам импоста наложатся."});
  R.cells.forEach(function(x, i){
    var nm = "Поле "+(i+1), t = x.t;
    if(t < L.fillMin || t > L.fillMax)
      out.push({l:"crit", t:nm+": заполнение "+t+" мм вне диапазона системы "+L.fillMin+"–"+L.fillMax+" мм."});
    if(!x.ok){ out.push({l:"crit", t:nm+": под "+t+" мм нет штапика в таблице системы."}); return; }
    if(x.gw <= 0 || x.gh <= 0){ out.push({l:"crit", t:nm+": вычеты съели поле целиком."}); return; }
    [["левая",x.eL],["правая",x.eR],["нижняя",x.eB],["верхняя",x.eT]].forEach(function(p){
      var e = p[1], clamp = e.g - sy.delta, gap = e.r - clamp;
      if(clamp < L.clampMin) out.push({l:"crit", t:nm+", "+p[0]+" кромка: защемление "+clamp+" мм меньше "+L.clampMin+"."});
      if(gap < L.gapMin) out.push({l:"crit", t:nm+", "+p[0]+" кромка: зазор до дна фальца "+gap+" мм меньше "+L.gapMin+"."});
    });
    if(!x.panel && x.kg > L.maxKg)
      out.push({l:"crit", t:nm+": вес "+x.kg.toFixed(0)+" кг выше предела системы "+L.maxKg+" кг."});
    if(isSash(x.type)){
      if(!x.panel && x.kg > L.sashKg)
        out.push({l:"warn", t:nm+": вес створки "+x.kg.toFixed(0)+" кг выше предела фурнитуры "+L.sashKg+" кг."});
      if(x.sashW > L.sashW || x.sashH > L.sashH)
        out.push({l:"warn", t:nm+": створка "+Math.round(x.sashW)+"×"+Math.round(x.sashH)+" вне размерной группы."});
    }
  });
  return out;
}

/* ============================================================
   ДАННЫЕ
   ============================================================ */
var DB = { orders:[], seq:1 };
var UI = { order:null, item:null, cell:"0", screen:"s-orders",
           defFill:"f32b", defSys:"w72", cutStock:6000, cutKerf:5 };
function order(){
  for(var i=0;i<DB.orders.length;i++){ if(DB.orders[i].id===UI.order) return DB.orders[i]; }
  return null;
}
function item(){
  var o = order(); if(!o) return null;
  for(var i=0;i<o.items.length;i++){ if(o.items[i].id===UI.item) return o.items[i]; }
  return o.items[0] || null;
}
function newOrder(){
  var o = { id:uid("o"), no:DB.seq++, created:Date.now(),
            client:{name:"", phone:"", addr:"", note:""}, items:[] };
  DB.orders.unshift(o); UI.order = o.id; UI.item = null;
  return o;
}
function selCell(){
  var it = item(); if(!it) return null;
  var R = itemCalc(it), c = null;
  R.cells.forEach(function(x){ if(x.key === UI.cell) c = x; });
  return c || R.cells[0];
}

/* ============================================================
   ПИКТОГРАММЫ — отраслевая условная графика открывания
   ============================================================ */
function openSvg(id){
  var w=58, h=64, m=5, x0=m, y0=m, x1=w-m, y1=h-m, cx=(x0+x1)/2, cy=(y0+y1)/2, s=[];
  s.push('<rect x="'+x0+'" y="'+y0+'" width="'+(x1-x0)+'" height="'+(y1-y0)+'" fill="var(--glass)" stroke="var(--frame-2)"/>');
  var ln = function(a,b,c,d){ return '<line x1="'+a+'" y1="'+b+'" x2="'+c+'" y2="'+d+'" stroke="var(--ink-2)" stroke-width="1.3"/>'; };
  var apexL = ln(x1,y0,x0,cy)+ln(x1,y1,x0,cy);   /* вершина указывает на петли */
  var apexR = ln(x0,y0,x1,cy)+ln(x0,y1,x1,cy);
  var apexT = ln(x0,y1,cx,y0)+ln(x1,y1,cx,y0);
  var apexB = ln(x0,y0,cx,y1)+ln(x1,y0,cx,y1);
  if(id==="turnL") s.push(apexL);
  if(id==="turnR") s.push(apexR);
  if(id==="tilt")  s.push(apexT);
  if(id==="top")   s.push(apexB);
  if(id==="ttL")   s.push(apexL+apexT);
  if(id==="ttR")   s.push(apexR+apexT);
  return '<svg viewBox="0 0 '+w+' '+h+'" aria-hidden="true">'+s.join("")+'</svg>';
}
function gridSvg(c, r, W, H){
  W=W||58; H=H||64;
  var pad=4, s=[], i, j;
  s.push('<rect x="1" y="1" width="'+(W-2)+'" height="'+(H-2)+'" fill="var(--frame)" stroke="var(--frame-2)"/>');
  var iw=(W-2*pad)/c, ih=(H-2*pad)/r;
  for(i=0;i<r;i++) for(j=0;j<c;j++)
    s.push('<rect x="'+(pad+j*iw+1.2)+'" y="'+(pad+i*ih+1.2)+'" width="'+(iw-2.4)+'" height="'+(ih-2.4)+
      '" fill="var(--glass)" stroke="var(--frame-2)" stroke-width=".8"/>');
  return '<svg viewBox="0 0 '+W+' '+H+'" aria-hidden="true">'+s.join("")+'</svg>';
}
function tplSvg(g){
  var W=76,H=66,pad=4,s=[],ri,ci;
  s.push('<rect x="1" y="1" width="'+(W-2)+'" height="'+(H-2)+'" fill="var(--frame)" stroke="var(--frame-2)"/>');
  var ih=(H-2*pad)/g.length;
  for(ri=0;ri<g.length;ri++){
    var iw=(W-2*pad)/g[ri];
    for(ci=0;ci<g[ri];ci++)
      s.push('<rect x="'+(pad+ci*iw+1.2)+'" y="'+(pad+ri*ih+1.2)+'" width="'+(iw-2.4)+'" height="'+(ih-2.4)+
        '" fill="var(--glass)" stroke="var(--frame-2)" stroke-width=".8"/>');
  }
  return '<svg viewBox="0 0 '+W+' '+H+'" aria-hidden="true">'+s.join("")+'</svg>';
}

var VB = { w:360, h:392, l:64, r:26, t:14, b:60 };
function drawWin(){
  var it = item();
  if(!it){ $("#draw").innerHTML = ""; return; }
  var R = itemCalc(it);
  var k = Math.min((VB.w - VB.l - VB.r)/it.W, (VB.h - VB.t - VB.b)/it.H);
  var ox = VB.l + (VB.w - VB.l - VB.r - it.W*k)/2, oy = VB.t;
  var X = function(v){ return ox + v*k; }, Y = function(v){ return oy + v*k; };
  var s = [];
  s.push('<rect x="'+X(0)+'" y="'+Y(0)+'" width="'+(it.W*k)+'" height="'+(it.H*k)+
    '" fill="var(--frame)" stroke="#8D979C"/>');
  R.cells.forEach(function(c){
    var ax=c.x+c.faceL, bx=c.x+c.w-c.faceR, ay=c.y+c.faceT, by=c.y+c.h-c.faceB, sy=R.sy;
    if(isSash(c.type)){
      var sx=ax-sy.L.ovl, sX=bx+sy.L.ovl, sy0=ay-sy.L.ovl, sY=by+sy.L.ovl;
      s.push('<rect x="'+X(sx)+'" y="'+Y(sy0)+'" width="'+Math.max(0,(sX-sx)*k)+'" height="'+Math.max(0,(sY-sy0)*k)+
        '" fill="var(--sash)" stroke="#8D979C"/>');
      ax=sx+sy.Z.f; bx=sX-sy.Z.f; ay=sy0+sy.Z.f; by=sY-sy.Z.f;
    }
    var gx=X(ax), gy=Y(ay), gw=Math.max(0,(bx-ax)*k), gh=Math.max(0,(by-ay)*k);
    s.push('<rect class="hit" data-cell="'+c.key+'" x="'+gx+'" y="'+gy+'" width="'+gw+'" height="'+gh+
      '" fill="'+(c.panel?"var(--panelfill)":"var(--glass)")+'" stroke="'+(c.key===UI.cell?"var(--acc)":"#9AAAB2")+
      '" stroke-width="'+(c.key===UI.cell?2.2:1)+'"/>');
    if(isSash(c.type) && gw > 26 && gh > 26){
      var m = Math.min(gw,gh)*0.14, x0=gx+m, y0=gy+m, x1=gx+gw-m, y1=gy+gh-m;
      var cxx=(x0+x1)/2, cyy=(y0+y1)/2;
      var L2 = function(a,b,cc,d){ return '<line x1="'+a+'" y1="'+b+'" x2="'+cc+'" y2="'+d+'" stroke="#5B6B73" stroke-width="1"/>'; };
      if(c.type==="turnL"||c.type==="ttL") s.push(L2(x1,y0,x0,cyy)+L2(x1,y1,x0,cyy));
      if(c.type==="turnR"||c.type==="ttR") s.push(L2(x0,y0,x1,cyy)+L2(x0,y1,x1,cyy));
      if(c.type==="tilt"||c.type==="ttL"||c.type==="ttR") s.push(L2(x0,y1,cxx,y0)+L2(x1,y1,cxx,y0));
      if(c.type==="top") s.push(L2(x0,y0,cxx,y1)+L2(x1,y0,cxx,y1));
    }
    /* ручки-фишки по краям поля: уравнять, делить вдоль, делить поперёк */
    if(gw > 52 && gh > 52){
      s.push(chip(gx+gw-13, gy+13, "eq", c.key, "="));
      s.push(chip(gx+gw/2, gy+gh/2, "sv", c.key, "⇔"));
      s.push(chip(gx+gw/2, gy+gh-14, "sh", c.key, "⇕"));
    }
  });
  R.imposts.forEach(function(m, i){
    var hx = m.dir==="v" ? X(m.x) : X(m.x + m.len/2);
    var hy = m.dir==="v" ? Y(m.y + m.len/2) : Y(m.y);
    s.push(chip(hx, hy, "del", i, "✕", true));
  });
  var sel = null;
  R.cells.forEach(function(c){ if(c.key === UI.cell) sel = c; });
  var cols = sel ? chain(it, sel.nd, "col") : null;
  var rows = sel ? chain(it, sel.nd, "row") : null;
  var dy1 = Y(it.H) + 20, dy2 = Y(it.H) + 40;
  if(cols && cols.length > 1){
    cols.forEach(function(kid, i){ s.push(dimH(X(kid.x), X(kid.x+kid.w), dy1, Math.round(kid.w), "K", i)); });
    s.push(dimH(X(0), X(it.W), dy2, it.W, "W"));
  }else s.push(dimH(X(0), X(it.W), dy1, it.W, "W"));
  if(rows && rows.length > 1){
    rows.forEach(function(kid, i){ s.push(dimV(X(0)-22, Y(kid.y), Y(kid.y+kid.h), Math.round(kid.h), "R", i)); });
    s.push(dimV(X(0)-44, Y(0), Y(it.H), it.H, "H"));
  }else s.push(dimV(X(0)-22, Y(0), Y(it.H), it.H, "H"));
  $("#draw").innerHTML = s.join("");
  bindDraw();
}
function chip(x, y, act, id, glyph, del){
  var c = del ? "var(--del)" : "var(--acc)";
  return '<g class="hit" data-act="'+act+'" data-id="'+id+'">'+
    '<rect x="'+(x-11)+'" y="'+(y-11)+'" width="22" height="22" rx="5" fill="'+c+'" fill-opacity=".92"/>'+
    '<text x="'+x+'" y="'+(y+5)+'" text-anchor="middle" font-size="14" fill="#fff" font-weight="600" '+
    'font-family="system-ui,sans-serif">'+glyph+'</text></g>';
}
function dimH(x1, x2, y, val, kind, idx){
  var mid=(x1+x2)/2;
  return '<g><line x1="'+x1+'" y1="'+y+'" x2="'+x2+'" y2="'+y+'" stroke="#6B777D" stroke-width="1"/>'+
    '<line x1="'+x1+'" y1="'+(y-4)+'" x2="'+x1+'" y2="'+(y+4)+'" stroke="#6B777D"/>'+
    '<line x1="'+x2+'" y1="'+(y-4)+'" x2="'+x2+'" y2="'+(y+4)+'" stroke="#6B777D"/>'+
    '<rect class="hit" data-dim="'+kind+'" data-idx="'+(idx===undefined?"":idx)+'" x="'+(mid-21)+'" y="'+(y-9)+
    '" width="42" height="18" rx="3" fill="var(--panel)" stroke="#B9C2C6"/>'+
    '<text x="'+mid+'" y="'+(y+4.5)+'" text-anchor="middle" font-size="11" fill="var(--ink)" font-weight="600">'+val+'</text></g>';
}
function dimV(x, y1, y2, val, kind, idx){
  var mid=(y1+y2)/2;
  return '<g><line x1="'+x+'" y1="'+y1+'" x2="'+x+'" y2="'+y2+'" stroke="#6B777D" stroke-width="1"/>'+
    '<line x1="'+(x-4)+'" y1="'+y1+'" x2="'+(x+4)+'" y2="'+y1+'" stroke="#6B777D"/>'+
    '<line x1="'+(x-4)+'" y1="'+y2+'" x2="'+(x+4)+'" y2="'+y2+'" stroke="#6B777D"/>'+
    '<rect class="hit" data-dim="'+kind+'" data-idx="'+(idx===undefined?"":idx)+'" x="'+(x-20)+'" y="'+(mid-9)+
    '" width="40" height="18" rx="3" fill="var(--panel)" stroke="#B9C2C6"/>'+
    '<text x="'+x+'" y="'+(mid+4.5)+'" text-anchor="middle" font-size="11" fill="var(--ink)" font-weight="600">'+val+'</text></g>';
}
function bindDraw(){
  $$("#draw [data-cell]").forEach(function(el){
    el.addEventListener("click", function(){
      var k = el.getAttribute("data-cell");
      if(k === UI.cell){ openCell(); return; }        /* повторный тап — диалог поля */
      UI.cell = k; save(); paintCanvas();
    });
  });
  $$("#draw [data-act]").forEach(function(el){
    el.addEventListener("click", function(ev){
      ev.stopPropagation(); doAct(el.getAttribute("data-act"), el.getAttribute("data-id"));
    });
  });
  $$("#draw [data-dim]").forEach(function(el){
    el.addEventListener("click", function(ev){
      ev.stopPropagation();
      var kind = el.getAttribute("data-dim"), idx = el.getAttribute("data-idx");
      var q = '#dims input[data-dim="'+kind+'"]' + (idx ? '[data-idx="'+idx+'"]' : "");
      var target = $(q) || $('#dims input[data-dim="'+kind+'"]');
      if(target){ target.focus(); target.select(); }
    });
  });
}
function doAct(act, id){
  var it = item(); if(!it) return;
  if(act === "del"){
    var R = itemCalc(it), m = R.imposts[+id];
    if(!m) return;
    var kids = m.node.kids;
    kids[m.i].size = (kids[m.i].size||1) + (kids[m.i+1].size||1);
    kids.splice(m.i+1, 1);
    if(kids.length === 1) collapse(m.node);
    UI.cell = "0"; save(); paintCanvas(); return;
  }
  var nd = leafByKey(it.root, id);
  if(!nd) return;
  if(act === "eq"){
    var par = parentOf(it.root, nd);
    if(par){ par.kids.forEach(function(k){ k.size = 1; }); save(); paintCanvas(); }
    else toast("Поле одно — уравнивать нечего");
    return;
  }
  if(act === "sv" || act === "sh"){
    applySplit(nd, act === "sv" ? 2 : 1, act === "sv" ? 1 : 2);
    UI.cell = id; save(); paintCanvas();
  }
}
function collapse(node){
  var only = node.kids[0], keep = node.size;
  Object.keys(node).forEach(function(k){ delete node[k]; });
  Object.keys(only).forEach(function(k){ node[k] = only[k]; });
  node.size = keep;
}
/* Деление поля на c × r. Свойства исходного поля наследует первая часть. */
function applySplit(nd, c, r){
  if(c === 1 && r === 1) return;
  var base = { type:nd.type, fill:nd.fill, panel:nd.panel, mesh:nd.mesh }, first = true;
  var mk = function(){
    var l = leaf(base.fill);
    if(first){ l.type = base.type; l.panel = base.panel; l.mesh = base.mesh; first = false; }
    return l;
  };
  var kids = [], i, j;
  if(r > 1){
    for(i=0;i<r;i++){
      if(c > 1){
        var cc = []; for(j=0;j<c;j++) cc.push(mk());
        kids.push(split("col", cc));
      }else kids.push(mk());
    }
    nd.sp = "row";
  }else{
    for(j=0;j<c;j++) kids.push(mk());
    nd.sp = "col";
  }
  nd.kids = kids;
  delete nd.type; delete nd.fill; delete nd.panel; delete nd.mesh;
}

/* ---------- строка размеров ---------- */
function renderDims(){
  var it = item(); if(!it){ $("#dims").innerHTML = ""; return; }
  var c = selCell();
  var cols = c ? chain(it, c.nd, "col") : null;
  var rows = c ? chain(it, c.nd, "row") : null;
  var h = '<div class="g"><label>Ш</label><input type="number" step="10" data-dim="W" value="'+it.W+'"></div>'+
          '<div class="g"><label>В</label><input type="number" step="10" data-dim="H" value="'+it.H+'"></div>';
  if(cols && cols.length > 1) cols.forEach(function(kid, i){
    h += '<div class="g"><label>'+(i+1)+'</label><input type="number" step="10" data-dim="K" data-idx="'+i+'" value="'+Math.round(kid.w)+'"></div>';
  });
  if(rows && rows.length > 1) rows.forEach(function(kid, i){
    h += '<div class="g"><label>ряд '+(i+1)+'</label><input type="number" step="10" data-dim="R" data-idx="'+i+'" value="'+Math.round(kid.h)+'"></div>';
  });
  h += '<div class="g"><label>шт</label><input type="number" step="1" min="1" data-dim="Q" value="'+it.qty+'"></div>';
  if(c) h += '<div class="cap">поле '+(+c.key+1)+' · '+esc(openById(c.type).n)+
    (c.panel ? ' · сэндвич-панель' : '')+' · <b>'+
    (c.ok ? (c.panel?"панель ":"стеклопакет ")+Math.round(c.gw)+" × "+Math.round(c.gh)+" × "+c.t : "не считается")+'</b></div>';
  $("#dims").innerHTML = h;
  $$("#dims input").forEach(function(inp){
    inp.addEventListener("input", function(){
      var it2 = item(), c2 = selCell(), kind = inp.getAttribute("data-dim"), v = +inp.value || 0;
      if(kind === "W"){ it2.W = Math.max(200, v); }
      else if(kind === "H"){ it2.H = Math.max(200, v); }
      else if(kind === "Q"){ it2.qty = Math.max(1, v|0); }
      else{
        var dir = (kind === "K") ? "col" : "row";
        var kids = c2 ? chain(it2, c2.nd, dir) : null;
        if(!kids) return;
        var i = +inp.getAttribute("data-idx"), kid = kids[i];
        var parent = parentOf(it2.root, kid);
        var full = (kind === "K") ? parent.w : parent.h;
        var want = Math.max(50, v), rest = full - want;
        if(rest < 50 * (kids.length - 1)) return;
        var others = kids.filter(function(x){ return x !== kid; });
        var oldOthers = others.reduce(function(a,x){ return a + ((kind==="K")?x.w:x.h); }, 0) || 1;
        kid.size = want;
        others.forEach(function(x){
          var was = (kind==="K") ? x.w : x.h;
          x.size = Math.max(50, Math.round(rest * was / oldOthers));
        });
      }
      save(); paintCanvas(true);
    });
  });
}

/* ---------- нижняя таблица ---------- */
function renderSum(){
  var o = order();
  $("#sumTbl").hidden = !(o && o.items.length && UI.screen === "s-canvas");
  if(!o || !o.items.length){ $("#sumTbl").innerHTML = ""; return; }
  var cur = item(), Rc = cur ? itemCalc(cur) : null;
  var m = function(R, role){ return R ? R.parts.reduce(function(a,p){ return a + (p.role===role?p.L:0); },0)/1000 : 0; };
  var glassN = function(R){ return R ? R.cells.filter(function(c){return c.ok && !c.panel;}).length : 0; };
  var panelN = function(R){ return R ? R.cells.filter(function(c){return c.ok && c.panel;}).length : 0; };
  var areaOf = function(R){ return R ? R.cells.reduce(function(a,c){return a+c.area;},0) : 0; };
  var sashN = function(R){ return R ? R.cells.filter(function(c){return isSash(c.type);}).length : 0; };
  var all = {ar:0,L:0,T:0,bead:0,seal:0,sash:0,g:0,p:0};
  o.items.forEach(function(it){
    var R = itemCalc(it), q = it.qty;
    all.ar += areaOf(R)*q; all.L += m(R,"L")*q; all.T += m(R,"T")*q;
    all.bead += m(R,"bead")*q; all.seal += m(R,"seal")*q;
    all.sash += sashN(R)*q; all.g += glassN(R)*q; all.p += panelN(R)*q;
  });
  var f2 = function(v){ return v.toFixed(2); };
  $("#sumTbl").innerHTML = '<table><thead><tr><th>позиция</th><th>площадь</th><th>рама</th><th>импост</th>'+
    '<th>штапик</th><th>уплотн.</th><th>створки</th><th>панели</th><th>пакеты</th></tr></thead><tbody>'+
    '<tr><td>это окно</td><td>'+f2(areaOf(Rc))+'</td><td>'+f2(m(Rc,"L"))+'</td><td>'+f2(m(Rc,"T"))+
      '</td><td>'+f2(m(Rc,"bead"))+'</td><td>'+f2(m(Rc,"seal"))+'</td><td>'+sashN(Rc)+'</td><td>'+panelN(Rc)+
      '</td><td class="acc">'+glassN(Rc)+'</td></tr>'+
    '<tr class="all"><td>весь заказ</td><td>'+f2(all.ar)+'</td><td>'+f2(all.L)+'</td><td>'+f2(all.T)+
      '</td><td>'+f2(all.bead)+'</td><td>'+f2(all.seal)+'</td><td>'+all.sash+'</td><td>'+all.p+
      '</td><td class="acc">'+all.g+'</td></tr></tbody></table>';
}

/* ---------- лента позиций ---------- */
function thumbSvg(it){
  var out = {leaves:[], imposts:[]};
  layout(it.root, 0, 0, it.W, it.H, out);
  var k = Math.min(38/it.W, 38/it.H), ox=(42-it.W*k)/2, oy=(42-it.H*k)/2, s=[];
  s.push('<rect x="'+ox+'" y="'+oy+'" width="'+(it.W*k)+'" height="'+(it.H*k)+'" fill="#EFF1F2" stroke="#6E7C83" stroke-width=".7"/>');
  out.leaves.forEach(function(n){
    s.push('<rect x="'+(ox+n.x*k+1.3)+'" y="'+(oy+n.y*k+1.3)+'" width="'+Math.max(0,n.w*k-2.6)+
      '" height="'+Math.max(0,n.h*k-2.6)+'" fill="'+(n.panel?"#C8C2B4":(isSash(n.type)?"#B4CCD8":"#CBDDE6"))+
      '" stroke="#6E7C83" stroke-width=".7"/>');
  });
  return '<svg viewBox="0 0 42 42">'+s.join("")+'</svg>';
}
function renderStrip(){

function nest(lengths, stock, kerf){
  var bars = [], i, j, put;
  lengths = lengths.slice().sort(function(a,b){ return b-a; });
  for(i=0;i<lengths.length;i++){
    var L = lengths[i]; put = false;
    if(L > stock){ bars.push({cuts:[L], rest:0}); continue; }
    for(j=0;j<bars.length;j++){
      var need = L + (bars[j].cuts.length ? kerf : 0);
      if(bars[j].rest >= need){ bars[j].cuts.push(L); bars[j].rest -= need; put = true; break; }
    }
    if(!put) bars.push({cuts:[L], rest:stock - L});
  }
  return bars;
}
function renderCut(){
  var Rs = orderCalc(), stock = UI.cutStock, kerf = UI.cutKerf;
  $("#cutStock").value = stock; $("#cutKerf").value = kerf;
  var byArt = {}, arts = [];
  Rs.forEach(function(R){
    for(var q=0;q<R.it.qty;q++){
      R.parts.forEach(function(p){
        if(p.role === "seal" || !p.L || p.L <= 0) return;
        if(!byArt[p.art]){ byArt[p.art] = {art:p.art, role:p.role, L:[]}; arts.push(byArt[p.art]); }
        byArt[p.art].L.push(Math.round(p.L));
      });
    }
  });
  var rank = {L:1, T:2, Z:3, bead:4};
  arts.sort(function(a,b){ return (rank[a.role]||9) - (rank[b.role]||9); });
  if(!arts.length){
    $("#cutMaps").innerHTML = '<div class="chk warn">В заказе нет посчитанных окон — раскраивать нечего.</div>';
    $("#partTbl").innerHTML = ""; $("#cutHint").textContent = "—"; return;
  }
  var totalBars = 0, totalUse = 0;
  $("#cutMaps").innerHTML = arts.map(function(a){
    var bars = nest(a.L, stock, kerf);
    var used = a.L.reduce(function(s,x){return s+x;},0);
    totalBars += bars.length; totalUse += used;
    var maps = bars.map(function(b, bi){
      var segs = b.cuts.map(function(c){
        return '<div style="width:'+(c/stock*100).toFixed(3)+'%">'+(c/stock > .07 ? c : "")+'</div>';
      }).join("");
      var rest = Math.max(0, b.rest);
      if(rest > 0) segs += '<div class="rest" style="width:'+(rest/stock*100).toFixed(3)+'%">'+
        (rest/stock > .09 ? "остаток "+Math.round(rest) : "")+'</div>';
      return '<div class="cuth"><span>хлыст '+(bi+1)+'</span><span>'+b.cuts.length+' '+
        plural(b.cuts.length,"деталь","детали","деталей")+' · остаток '+Math.round(rest)+' мм</span></div>'+
        '<div class="cutbar">'+segs+'</div>';
    }).join("");
    var waste = bars.length ? (1 - used/(bars.length*stock))*100 : 0;
    return '<div style="margin-bottom:14px"><div style="font-weight:700;font-size:13.5px">'+esc(a.art)+'</div>'+
      '<div style="font-size:11.5px;color:var(--ink-3);margin-top:2px">'+a.L.length+' '+
      plural(a.L.length,"деталь","детали","деталей")+' · '+bars.length+' '+
      plural(bars.length,"хлыст","хлыста","хлыстов")+' · отход '+waste.toFixed(1)+'%</div>'+maps+'</div>';
  }).join("");
  var w = totalBars ? (1 - totalUse/(totalBars*stock))*100 : 0;
  $("#cutHint").textContent = totalBars+" "+plural(totalBars,"хлыст","хлыста","хлыстов")+" · отход "+w.toFixed(1)+"%";

  var h = '<thead><tr><th>артикул</th><th class="r">деталей</th><th class="r">погонаж</th><th class="r">длины</th></tr></thead><tbody>';
  arts.forEach(function(a){
    var cnt = {}, uniq = [];
    a.L.forEach(function(x){ if(!cnt[x]){ cnt[x]=0; uniq.push(x); } cnt[x]++; });
    uniq.sort(function(x,y){return y-x;});
    var used = a.L.reduce(function(s,x){return s+x;},0);
    h += '<tr><td>'+esc(a.art)+'</td><td class="r num">'+a.L.length+'</td><td class="r num">'+
      (used/1000).toFixed(2)+' м</td><td class="r num">'+
      uniq.slice(0,6).map(function(x){ return x+'×'+cnt[x]; }).join(", ")+(uniq.length>6?" …":"")+'</td></tr>';
  });
  $("#partTbl").innerHTML = h + '</tbody>';
}
function renderEdge(){
  var c = selCell(), it = item();
  if(!c || !it){ $("#edgeDerive").textContent = "Поле не выбрано."; $("#kitTbl").innerHTML=""; return; }
  var sy = sysById(it.sysId);
  $("#edgeTitle").textContent = "Поле " + (+c.key + 1) + " · " + openById(c.type).n;
  if(!c.ok){
    $("#edgeDerive").innerHTML = '<span class="bad">Штапик под '+c.t+' мм не найден — расчёт кромок невозможен.</span>';
    $("#kitTbl").innerHTML = ""; $("#edgeWarn").innerHTML = ""; return;
  }
  var pad = function(s,n){ s=String(s); while(s.length<n) s+=" "; return s; };
  var line = function(t,e){ return "  "+pad(t,9)+pad(e.words,22)+"вычет "+pad(e.d,4)+"("+e.expr+")"; };
  var d = "  поле "+(+c.key+1)+" · "+openById(c.type).n+" · "+c.fill.n+"\n\n";
  d += line("слева",c.eL)+"\n"+line("справа",c.eR)+"\n"+line("сверху",c.eT)+"\n"+line("снизу",c.eB)+"\n\n";
  d += "  <b>Ш = "+c.w+" − "+c.eL.d+" − "+c.eR.d+" = "+Math.round(c.gw)+"</b>\n";
  d += "  <b>В = "+c.h+" − "+c.eT.d+" − "+c.eB.d+" = "+Math.round(c.gh)+"</b>\n\n";
  var clamp = c.eL.g - sy.delta, gap = c.eL.r - clamp;
  var mk = function(ok){ return ok ? '<span class="good">✓</span>' : '<span class="bad">✗</span>'; };
  d += "  штапик "+c.bead.art+" · защемление "+clamp+" мм "+mk(clamp>=sy.lim.clampMin)+
       " · зазор "+gap+" мм "+mk(gap>=sy.lim.gapMin)+
       " · вес "+c.kg.toFixed(0)+" кг "+mk(c.kg<=sy.lim.maxKg);
  $("#edgeDerive").innerHTML = d;
  var asym = (c.eL.d !== c.eR.d) || (c.eT.d !== c.eB.d);
  $("#edgeWarn").innerHTML = asym
    ? '<div class="chk warn">Вычеты противоположных кромок различаются — соседи разные. Формула «минус два раза по столько-то» дала бы другой размер.</div>' : '';
  var per = 2*(c.gw + c.gh)/1000;
  var kit = [
    ["штапик "+c.bead.art, per.toFixed(2)+" м", "периметр заполнения, 4 отрезка"],
    ["уплотнитель наружный", per.toFixed(2)+" м", "контур по периметру"],
    ["уплотнитель внутренний", per.toFixed(2)+" м", "контур по периметру"],
    ["подкладки опорные", "2 шт", "на нижнюю кромку, отступ 50–80 мм от углов, ширина "+(c.t+2)+" мм"],
    ["подкладки дистанционные", "2 шт", "по боковым кромкам, держат зазор"],
    ["угловые соединители", (isSash(c.type)?"4 шт":"—"), (isSash(c.type)?"углы створки":"поле без собственной рамки")],
    ["комплект фурнитуры", (isSash(c.type)?"1 компл":"—"), openById(c.type).n],
    ["москитная сетка", (c.mesh?"1 шт":"—"), (c.mesh?"по световому проёму":"не заказана")]
  ];
  var kh = '<thead><tr><th>комплектующее</th><th class="r">кол-во</th><th>база расчёта</th></tr></thead><tbody>';
  kit.forEach(function(r){ kh += '<tr><td>'+esc(r[0])+'</td><td class="r num">'+esc(r[1])+'</td><td>'+esc(r[2])+'</td></tr>'; });
  $("#kitTbl").innerHTML = kh + '</tbody>';
}

/* ============================================================
   НАВИГАЦИЯ И ХРАНЕНИЕ
   ============================================================ */
var TITLES = { "s-orders":"Заказы", "s-canvas":"Окно", "s-glass":"Стеклопакеты",
               "s-cut":"Раскрой профиля", "s-edge":"Кромки поля", "s-client":"Заказчик" };
function nav(id){
  if(id !== "s-orders" && !order()){ toast("Сначала создайте заказ"); id = "s-orders"; }
  UI.screen = id;
  $$("section").forEach(function(s){ s.hidden = (s.id !== id); });
  $$("[data-nav]").forEach(function(b){ b.setAttribute("aria-current", String(b.getAttribute("data-nav")===id)); });
  $("#dock").style.display = (id === "s-orders" || id === "s-canvas") ? "flex" : "none";
  $("#sumTbl").hidden = (id !== "s-canvas");
  var o = order();
  if(id === "s-canvas") paintCanvas();
  else{
    $("#ttl").textContent = TITLES[id];
    $("#who").textContent = o ? (o.client.name || "заказ №"+o.no) : "";
  }
  if(id === "s-orders") renderOrders();
  if(id === "s-glass") renderGlass();
  if(id === "s-cut") renderCut();
  if(id === "s-edge") renderEdge();
  if(id === "s-client") loadClient();
  closeSheet(); closeModals();
  window.scrollTo(0,0); save();
}
function openPanel(id){
  if(id === "pWin") renderWinPanel();
  if(id === "pSys"){ PSYS = item() ? sysById(item().sysId) : sysById(UI.defSys); renderSysPanel(); }
  $("#"+id).classList.add("on"); $("#scrim").classList.add("on"); closeSheet();
}
function openSheet(){ $("#sheet").classList.add("on"); $("#scrim").classList.add("on"); }
function closeSheet(){ $("#sheet").classList.remove("on"); }
function loadClient(){
  var o = order(); if(!o) return;
  $("#cName").value = o.client.name; $("#cPhone").value = o.client.phone;
  $("#cAddr").value = o.client.addr; $("#cNote").value = o.client.note;
}
function saveClient(){
  var o = order(); if(!o) return;
  o.client.name = $("#cName").value; o.client.phone = $("#cPhone").value;
  o.client.addr = $("#cAddr").value; o.client.note = $("#cNote").value;
  save();
}
var LSKEY = "winhub.alm2.v2";
function save(){
  try{ localStorage.setItem(LSKEY, JSON.stringify({SYSTEMS:SYSTEMS, FILLS:FILLS, DB:DB, UI:UI})); }catch(e){}
}
function load(){
  try{
    var raw = localStorage.getItem(LSKEY); if(!raw) return false;
    var d = JSON.parse(raw); if(!d || !d.DB) return false;
    if(d.SYSTEMS && d.SYSTEMS.length) SYSTEMS = d.SYSTEMS;
    if(d.FILLS && d.FILLS.length) FILLS = d.FILLS;
    DB = d.DB;
    Object.keys(d.UI||{}).forEach(function(k){ UI[k] = d.UI[k]; });
    return true;
  }catch(e){ return false; }
}
function toast(m){
  var t = $("#toast"); t.textContent = m; t.classList.add("on");
  setTimeout(function(){ t.classList.remove("on"); }, 1900);
}

function boot(){
  load();
  $("#moreBtn").addEventListener("click", function(){
    if($("#sheet").classList.contains("on")){ closeSheet(); $("#scrim").classList.remove("on"); }
    else openSheet();
  });
  $("#scrim").addEventListener("click", function(){ closeSheet(); closeModals(); });
  $$("[data-nav]").forEach(function(b){ b.addEventListener("click", function(){ nav(b.getAttribute("data-nav")); }); });
  $$("[data-open]").forEach(function(b){ b.addEventListener("click", function(){ openPanel(b.getAttribute("data-open")); }); });
  $$("[data-close]").forEach(function(b){ b.addEventListener("click", function(){ closeModals(); paintCanvas(); }); });

  $("#plus").addEventListener("click", function(){
    if(UI.screen === "s-orders" || !order()){ newOrder(); save(); loadClient(); nav("s-client"); return; }
    openTpl();
  });
  $("#tplNo").addEventListener("click", closeModals);
  $("#tplYes").addEventListener("click", function(){
    if(!tplPick){ toast("Выберите конфигурацию"); return; }
    var o = order(); if(!o) o = newOrder();
    var it = mkItem(tplPick);
    o.items.push(it); UI.item = it.id; UI.cell = "0";
    save(); closeModals(); nav("s-canvas");
  });
  $("#cellNo").addEventListener("click", function(){
    var it = item();
    if(it && cellSnapshot){ it.root = JSON.parse(cellSnapshot); UI.cell = "0"; }
    cellSnapshot = null; save(); closeModals(); paintCanvas();
  });
  $("#cellYes").addEventListener("click", function(){ cellSnapshot = null; closeModals(); paintCanvas(); });

  ["#cName","#cPhone","#cAddr","#cNote"].forEach(function(s){ $(s).addEventListener("input", saveClient); });
  $("#cDone").addEventListener("click", function(){
    saveClient();
    var o = order();
    nav("s-canvas");
    if(o && !o.items.length) openTpl();
  });
  $("#cutStock").addEventListener("input", function(){ UI.cutStock = Math.max(1000, +this.value||6000); save(); renderCut(); });
  $("#cutKerf").addEventListener("input", function(){ UI.cutKerf = Math.max(0, +this.value||0); save(); renderCut(); });

  nav(order() ? (UI.screen || "s-canvas") : "s-orders");
}
boot();
</script>
